stages: [install, lint, build, deploy]

default:
  image: node:20
  cache:
    paths:
      - node_modules/

install:
  stage: install
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 week

lint:
  stage: lint
  needs: ["install"]
  script:
    - npm run lint

build:
  stage: build
  needs: ["install"]
  script:
    - npm run build
  artifacts:
    paths:
      - dist/angular-a11y-demo
    expire_in: 1 week

pages:
  stage: deploy
  needs: ["build"]
  script:
    - rm -rf public
    - mkdir -p public
    - cp -r dist/angular-a11y-demo/* public/
  artifacts:
    paths:
      - public
  only:
    - main